[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nirbhed"
version = "0.3.0"
description = "Autonomous, token-frugal offensive-security AI agent and MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harsh Banshpal" }]
keywords = ["pentest", "offensive-security", "mcp", "ai-agent", "bug-bounty", "red-team"]
classifiers = [
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pyyaml>=6",
    "pydantic>=2",
]

[project.optional-dependencies]
# Standalone agent mode (API key). MCP mode does NOT need these.
agent = ["openai>=1.40"]
# MCP server mode (Claude Desktop / any MCP client, no API key).
mcp = ["mcp>=1.2,<2.0"]
all = ["openai>=1.40", "mcp>=1.2,<2.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
nirbhed = "nirbhed.cli:app"

[project.urls]
Homepage = "https://github.com/banshpalharsh/nirbhed"

[tool.hatch.build.targets.wheel]
packages = ["nirbhed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.flake8-bugbear]
# Typer requires Option()/Argument() calls as parameter defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
